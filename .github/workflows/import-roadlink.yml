name: Import validated RoadLink source
'on':
  push:
    branches: [main]
    paths: ['.bootstrap/**', '.github/workflows/import-roadlink.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce validated source without changing workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          import_dir="$RUNNER_TEMP/roadlink-verified-import"
          mkdir -p "$import_dir"
          cp .github/workflows/import-roadlink.yml "$import_dir/import-workflow.yml"
          cp .github/workflows/android.yml "$import_dir/android-workflow.yml"
          cat .bootstrap/part-*.b64 | base64 --decode > "$import_dir/patch.gz"
          printf '%s  %s\n' 'ae2de12ff3918639d07d04319579241c1fd15ceb72a7e8630209d7d3128cce79' "$import_dir/patch.gz" | sha256sum --check -
          gzip --decompress --stdout "$import_dir/patch.gz" > "$import_dir/source.patch"
          git init "$import_dir/source"
          git -C "$import_dir/source" remote add origin https://github.com/shihabal3amri/DiPlay.git
          git -C "$import_dir/source" fetch --depth=1 origin 143f4674b60b564a16baae5110b3b90fb7277631
          git -C "$import_dir/source" checkout --detach FETCH_HEAD
          git -C "$import_dir/source" apply --index --binary "$import_dir/source.patch"
          test "$(git -C "$import_dir/source" write-tree)" = '7751dca6d66691cdb43fcec1daa6580860521c9c'
          env -u GH_TOKEN python3 "$import_dir/source/scripts/check_public_tree.py"
          rsync -a --delete --exclude='.git' "$import_dir/source/" "$GITHUB_WORKSPACE/"
          git add --all
          test "$(git write-tree)" = '7751dca6d66691cdb43fcec1daa6580860521c9c'
          env -u GH_TOKEN python3 scripts/check_public_tree.py
          # The Actions token never edits workflows. The authorized connector handles them.
          cp "$import_dir/import-workflow.yml" .github/workflows/import-roadlink.yml
          cp "$import_dir/android-workflow.yml" .github/workflows/android.yml
          git add .github/workflows
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish validated RoadLink receiver source snapshot' -m 'Derived from DiPlay 143f4674b60b564a16baae5110b3b90fb7277631. Original authorship and licenses retained. Workflow activation is a separate authorized step.'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" git push origin HEAD:main
          unset auth_header GH_TOKEN
